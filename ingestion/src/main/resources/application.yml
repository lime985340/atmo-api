spring:
  application:
    name: atmo-ingestion
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configtree:/etc/secrets/}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  forecast:
    retention-days: ${APP_FORECAST_RETENTION_DAYS:2}
  external:
    publicdata:
      service-key: ${APP_PUBLICDATA_SERVICE_KEY:${app.external.publicdata.kma.service-key:}}
      airkorea:
        service-key: ${app.external.publicdata.airkorea.service-key:}
      kma:
        service-key: ${app.external.publicdata.kma.service-key:}
