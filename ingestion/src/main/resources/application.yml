spring:
  application:
    name: atmo-ingestion
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configtree:/etc/secrets/}"
  main:
    web-application-type: none
  datasource:
    url: ${SPRING_DATASOURCE_URL:${spring.datasource.url:jdbc:postgresql://localhost:5432/app}}
    username: ${SPRING_DATASOURCE_USERNAME:${spring.datasource.username:app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${spring.datasource.password:app}}
    hikari:
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:240000}
      connection-test-query: SELECT 1
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  forecast:
    retention-days: ${APP_FORECAST_RETENTION_DAYS:2}
  external:
    publicdata:
      service-key: ${APP_PUBLICDATA_SERVICE_KEY:${app.external.publicdata.kma.service-key:}}
      airkorea:
        service-key: ${app.external.publicdata.airkorea.service-key:}
      kma:
        service-key: ${app.external.publicdata.kma.service-key:}
