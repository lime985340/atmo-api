spring:
  datasource:
    url: jdbc:h2:mem:apitest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    access-secret: test
    refresh-secret: test
  external:
    publicdata:
      service-key: test
  oauth:
    providers:
      google:
        client-id: test
        client-secret: test
        redirect-uri: http://localhost/test
      naver:
        client-id: test
        client-secret: test
        redirect-uri: http://localhost/test
      kakao:
        client-id: test
        client-secret: test
        redirect-uri: http://localhost/test
