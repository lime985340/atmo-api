server:
  port: 8080
spring:
  application:
    name: atmos-api
  config:
    # [FILE] k8s에서는 /etc/secrets 아래 파일을 설정으로 로드(configtree). 로컬에 없으면 optional이라 무시됨.
    # [ENV] 필요 시 SPRING_CONFIG_IMPORT 로 import 소스를 오버라이드 가능.
    import: "${SPRING_CONFIG_IMPORT:optional:configtree:/etc/secrets/}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    issuer: ${JWT_ISSUER:weather-air}
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  external:
    partner:
      # [ENV] EXTERNAL_PARTNER_APIKEY 또는 [FILE] /etc/secrets/EXTERNAL_PARTNER_APIKEY
      api-key: ${EXTERNAL_PARTNER_APIKEY:}
  oauth:
    providers:
      google:
        client-id: ${APP_OAUTH_PROVIDERS_GOOGLE_CLIENT_ID:}
        client-secret: ${APP_OAUTH_PROVIDERS_GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_PROVIDERS_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
        scope: ${APP_OAUTH_PROVIDERS_GOOGLE_SCOPE:openid email profile}
        auth-uri: ${APP_OAUTH_PROVIDERS_GOOGLE_AUTH_URI:https://accounts.google.com/o/oauth2/v2/auth}
        token-uri: ${APP_OAUTH_PROVIDERS_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
        userinfo-uri: ${APP_OAUTH_PROVIDERS_GOOGLE_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      naver:
        client-id: ${APP_OAUTH_PROVIDERS_NAVER_CLIENT_ID:}
        client-secret: ${APP_OAUTH_PROVIDERS_NAVER_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_PROVIDERS_NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/naver/callback}
        scope: ${APP_OAUTH_PROVIDERS_NAVER_SCOPE:name email}
        auth-uri: ${APP_OAUTH_PROVIDERS_NAVER_AUTH_URI:https://nid.naver.com/oauth2.0/authorize}
        token-uri: ${APP_OAUTH_PROVIDERS_NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
        userinfo-uri: ${APP_OAUTH_PROVIDERS_NAVER_USERINFO_URI:https://openapi.naver.com/v1/nid/me}
      kakao:
        client-id: ${APP_OAUTH_PROVIDERS_KAKAO_CLIENT_ID:}
        client-secret: ${APP_OAUTH_PROVIDERS_KAKAO_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_PROVIDERS_KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
        scope: ${APP_OAUTH_PROVIDERS_KAKAO_SCOPE:openid account_email profile_nickname}
        auth-uri: ${APP_OAUTH_PROVIDERS_KAKAO_AUTH_URI:https://kauth.kakao.com/oauth/authorize}
        token-uri: ${APP_OAUTH_PROVIDERS_KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
        userinfo-uri: ${APP_OAUTH_PROVIDERS_KAKAO_USERINFO_URI:https://kapi.kakao.com/v2/user/me}
