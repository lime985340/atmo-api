server:
  port: 8080

spring:
  application:
    name: atmo-api
  config:
    import: "${SPRING_CONFIG_IMPORT:optional:configtree:/etc/secrets/}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:${spring.datasource.url:jdbc:postgresql://localhost:5432/app}}
    username: ${SPRING_DATASOURCE_USERNAME:${spring.datasource.username:app}}
    password: ${SPRING_DATASOURCE_PASSWORD:${spring.datasource.password:app}}
    hikari:
      max-lifetime: 580000
      connection-test-query: SELECT 1
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:${spring.redis.host:localhost}}
      port: ${SPRING_REDIS_PORT:${spring.redis.port:6379}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # Keep local and Quick Tunnel development origins in CorsConfig defaults.
    # Set APP_CORS_ALLOWED_ORIGINS explicitly for a fixed production domain.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

  jwt:
    access-secret: ${APP_JWT_ACCESS_SECRET:}
    refresh-secret: ${APP_JWT_REFRESH_SECRET:}
    access-ttl-seconds: ${APP_JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${APP_JWT_REFRESH_TTL_SECONDS:2592000}

  external:
    publicdata:
      service-key: ${app.external.publicdata.service-key:}

  oauth:
    providers:
      google:
        client-id: ${APP_OAUTH_GOOGLE_CLIENT_ID:}
        client-secret: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}

      naver:
        client-id: ${APP_OAUTH_NAVER_CLIENT_ID:}
        client-secret: ${APP_OAUTH_NAVER_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_NAVER_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/naver/callback}

      kakao:
        client-id: ${APP_OAUTH_KAKAO_CLIENT_ID:}
        client-secret: ${APP_OAUTH_KAKAO_CLIENT_SECRET:}
        redirect-uri: ${APP_OAUTH_KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/kakao/callback}
