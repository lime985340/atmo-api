services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16
    container_name: atmo-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atmo-network

  # Spring Boot 애플리케이션
  api:
    # 이미지 생성
    build:
      context: ..              # 프로젝트 루트 (docker 디렉토리의 상위)
      dockerfile: docker/Dockerfile
    container_name: atmo-api
    ports:
      - "8080:8080"
    environment:
      # DB 연결 설정 (postgres 컨테이너 이름 사용)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      
      # JWT 설정 (로컬 개발용)
      JWT_ACCESS_SECRET: local-development-access-secret-change-in-production
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-in-production
      
      # CORS 설정
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      
      # 외부 API 키 (필요시 변경)
      EXTERNAL_PARTNER_APIKEY: test-api-key-for-local
      
      # OAuth 설정 (필요시 추가)
      # APP_OAUTH_PROVIDERS_GOOGLE_CLIENT_ID: your-client-id
      # APP_OAUTH_PROVIDERS_GOOGLE_CLIENT_SECRET: your-client-secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atmo-network

volumes:
  postgres_data:
    driver: local

networks:
  atmo-network:
    driver: bridge
